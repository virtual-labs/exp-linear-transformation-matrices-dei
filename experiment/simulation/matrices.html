    <h2 class="pagehead">Matrix Associated with a Linear Transformation</h2>
    <a href="./" class="previous">&laquo; Previous</a>
<a href="./lt.html" class="next" >Next &raquo;</a><br><br>
<div class="container">
    <ul><li>Consider a linear transformation <i>T:R</i> &rarr; <i>R</i><sup>2</sup> defined by</li>
    <p>&emsp; <i>T</i> = (<i>x</i>, 3<i>x</i>); <i>x</i> &isin; <i>R</i></p>
    <label><li>To find matrix associated with <i>T</i> w.r.t given bases of real vector spaces <i>R</i> and <i>R</i><sup>2</sup>.</li> <br><li>Choose </li> <br>&emsp; <i>B</i><sub>1</sub> = </label>
    {<input class="basisinput" id="a" type="number">}<!--{a &ne; 0 ; a &isin; R}--> <label> as a basis of <i>R</i> and <br>&emsp; <i>B</i><sub>2</sub> = </label>
    {(<input class="basisinput" id="c" type="number">,
    <input class="basisinput" id="d" type="number">) , 
    (<input class="basisinput" id="e" type="number">, 
    <input class="basisinput" id="f" type="number">)}<label> as a basis of <i>R</i><sup>2</sup></label><br><br>
    

    <input class="subbtn" type="submit" value="Submit" onclick="showbasis()">
    <p id="displaybasis1"></p>
    <!-- <p id="displaybasis2"></p> -->
    
    <p id="displayT"></p>
    <p id="alBt"></p>
    <p id="displayT1"></p>
    <div id="mat"></div>
    <p id='note' style="font-size: 1rem; color:blue;">NOTE: You can observe that different bases may give different matrices.</p>
